<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PossAbilities Stores</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#EDF1F4; --panel:#FFFFFF; --ink:#172536; --muted:#5A6878; --line:#D3DBE3;
  --tape:#F2B632; --tape-ink:#3A2A00; --navy:#1F3B5C;
  --ok:#2A7F55; --ok-bg:#E3F3EA; --low:#B8660B; --low-bg:#FDF0DC; --out:#C23B3B; --out-bg:#FBE4E4;
  --field:#F7F9FB; --shadow:0 1px 0 rgba(23,37,54,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1822; --panel:#17222F; --ink:#E6ECF2; --muted:#9AA8B7; --line:#2A3847;
    --tape:#F2B632; --tape-ink:#2B1F00; --navy:#8FB6DE;
    --ok:#5BC48E; --ok-bg:#15301F; --low:#F0A94A; --low-bg:#35270F; --out:#F07A7A; --out-bg:#3A1B1B;
    --field:#1C2938; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1822; --panel:#17222F; --ink:#E6ECF2; --muted:#9AA8B7; --line:#2A3847;
  --tape:#F2B632; --tape-ink:#2B1F00; --navy:#8FB6DE;
  --ok:#5BC48E; --ok-bg:#15301F; --low:#F0A94A; --low-bg:#35270F; --out:#F07A7A; --out-bg:#3A1B1B;
  --field:#1C2938; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand h1{margin:0;font-size:1.75rem;line-height:1.15;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
nav.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
nav.tabs button[aria-selected="true"]{background:var(--navy);color:var(--panel)}
.count{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--out);color:#fff;font-size:.8rem;line-height:22px;text-align:center}

.alert{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--low-bg);border:1px solid color-mix(in srgb,var(--low) 35%,transparent);border-left:6px solid var(--low);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.alert strong{color:var(--low)}
.alert .names{flex:1 1 300px;color:var(--ink)}
.alert.hidden{display:none}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1 1 220px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);min-height:40px}
.chip[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:color-mix(in srgb,var(--navy) 10%,var(--panel))}
.btn{border:0;border-radius:9px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:700;background:var(--navy);color:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.tape{background:var(--tape);color:var(--tape-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--out);color:#fff}
.btn.small{min-height:36px;padding:6px 12px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.stats{display:flex;flex-wrap:wrap;gap:22px;margin:0 0 14px;color:var(--muted)}
.stats b{color:var(--ink);font-size:1.15rem;margin-right:4px}

/* Shelf-label item cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.card .photo{aspect-ratio:4/3;background:var(--field);display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:zoom-in;width:100%;overflow:hidden}
.card .photo img{width:100%;height:100%;object-fit:cover;display:block}
.card .photo.none{cursor:default;color:var(--muted);font-size:.9rem}
.card .photo.none svg{opacity:.45}
.label{border-top:4px solid var(--tape);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.label .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.label h3{margin:0;font-size:1.08rem;line-height:1.25}
.label .meta{color:var(--muted);font-size:.9rem}
.qty{font-size:1.9rem;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qty small{font-size:.9rem;font-weight:400;color:var(--muted);margin-left:4px;letter-spacing:0}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.82rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.low{background:var(--low-bg);color:var(--low)}
.badge.out{background:var(--out-bg);color:var(--out)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--field);border:1px solid var(--line);overflow:visible}
.meter .fill{height:100%;border-radius:4px;background:var(--ok)}
.meter.low .fill{background:var(--low)} .meter.out .fill{background:var(--out)}
.meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.meterlabel{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.actions .btn{flex:1 1 auto}

.empty{text-align:center;padding:50px 20px;background:var(--panel);border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:1.2rem}

/* Log */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.88rem;color:var(--muted);font-weight:700;background:var(--field);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
td.num.in{color:var(--ok)} td.num.outq{color:var(--out)}
.itemcell{display:flex;gap:10px;align-items:center}
.thumb{width:38px;height:38px;border-radius:5px;object-fit:cover;background:var(--field);flex:none}
.subtle{color:var(--muted);font-size:.88rem}
.logfilters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.logfilters label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){.logfilters{grid-template-columns:1fr 1fr}.logfilters .wide{grid-column:1/-1}}

/* Dialogs */
dialog{border:0;border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,18,28,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dhead{padding:18px 20px 10px;border-bottom:4px solid var(--tape)}
.dhead h2{margin:0;font-size:1.25rem}
.dhead p{margin:4px 0 0;color:var(--muted)}
.dbody{padding:16px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.dbody .full{grid-column:1/-1}
.dbody label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.93rem}
.dbody label .hint{font-weight:400;color:var(--muted);font-size:.83rem}
.dfoot{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.dfoot .left{margin-right:auto}
@media (max-width:520px){.dbody{grid-template-columns:1fr}}
.photopick{display:flex;gap:12px;align-items:center}
.photopick .prev{width:96px;height:72px;border-radius:6px;background:var(--field);border:1.5px dashed var(--line);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;overflow:hidden}
.photopick .prev img{width:100%;height:100%;object-fit:cover}
.photopick .btns{display:flex;flex-direction:column;gap:6px}
.checkline{flex-direction:row!important;align-items:center;gap:10px!important;font-weight:400!important}
.checkline input{width:20px;height:20px}
.err{color:var(--out);font-weight:700;min-height:1.2em;grid-column:1/-1;margin:0}
.lightbox{width:min(900px,calc(100vw - 24px))}
.lightbox img{display:block;width:100%;max-height:78dvh;object-fit:contain;background:#000}
.lightbox .cap{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--out-bg);color:var(--out);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:700}
.loading{color:var(--muted);padding:40px 0;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Additions */
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.live.off i{background:var(--out)}
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(400px,100%);overflow:hidden}
.loginbox .dhead h1{margin:0;font-size:1.5rem}
.loginbox form{padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.loginbox label{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.93rem}
input[type=password],input[type=email],input[type=tel],input[type=url]{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
.pwrow{position:relative}
.pwrow input{padding-right:70px}
.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--navy);font-weight:700;cursor:pointer;padding:6px 8px}
.sup{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.sup .label{border-top-color:var(--navy)}
.sup dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.93rem}
.sup dt{color:var(--muted)}
.sup dd{margin:0;overflow-wrap:anywhere}
.sup a{color:var(--navy);font-weight:700}
.reorder{background:var(--low-bg);color:var(--ink);border-radius:6px;padding:8px 10px;font-size:.9rem}
.reorder strong{color:var(--low)}
.supline{font-size:.88rem;color:var(--muted)}
.supline a{color:var(--navy)}
.alert .sups{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen" hidden>
  <div class="loginbox">
    <div class="dhead"><h1>PossAbilities Stores</h1><p>Log in to manage stock.</p></div>
    <form id="loginForm" novalidate>
      <label>Username<input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password<span class="pwrow"><input type="password" name="password" id="pw" autocomplete="current-password" required><button type="button" id="pwToggle" aria-label="Show password">Show</button></span></label>
      <p class="err" id="loginErr" style="margin:0"></p>
      <button class="btn tape" type="submit" id="loginBtn">Log in</button>
    </form>
  </div>
</div>

<!-- APP -->
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>PossAbilities Stores</h1>
      <p>Stock levels, reorder alerts, suppliers and a record of everything issued.</p>
    </div>
    <div class="topright">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="stock" aria-selected="true">Stock <span class="count" id="lowCount" hidden>0</span></button>
        <button role="tab" data-tab="log" aria-selected="false">Issue log</button>
        <button role="tab" data-tab="suppliers" aria-selected="false">Suppliers</button>
      </nav>
      <span class="live" id="live" title="Changes from other devices appear automatically"><i></i><span id="liveText">Live</span></span>
      <button class="btn ghost small" id="logoutBtn">Log out</button>
    </div>
  </header>

  <!-- STOCK -->
  <section id="view-stock" role="tabpanel">
    <div class="alert hidden" id="lowAlert">
      <div class="names"><strong id="lowAlertTitle"></strong><span id="lowAlertNames" style="display:block"></span></div>
      <button class="btn small ghost" id="showLowBtn">Show these</button>
    </div>
    <div class="toolbar">
      <div class="grow"><input type="search" id="search" placeholder="Search items, categories or locations" aria-label="Search items"></div>
      <div style="flex:0 1 200px"><select id="catFilter" aria-label="Filter by category"><option value="">All categories</option></select></div>
      <div class="chips" role="group" aria-label="Stock status">
        <button class="chip" data-status="all" aria-pressed="true">All</button>
        <button class="chip" data-status="low" aria-pressed="false">Running low</button>
        <button class="chip" data-status="out" aria-pressed="false">Out of stock</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="stats grow" id="stats" style="margin:0"></div>
      <button class="btn ghost" id="dlStock">Download stock list</button>
      <button class="btn tape" id="addItemBtn">+ Add item</button>
    </div>
    <div id="grid" class="grid"><div class="loading">Loading stores…</div></div>
  </section>

  <!-- LOG -->
  <section id="view-log" role="tabpanel" hidden>
    <div class="logfilters">
      <label class="wide">Search<input type="search" id="logSearch" placeholder="Person, item, purpose or recorded by"></label>
      <label>From<input type="date" id="logFrom"></label>
      <label>To<input type="date" id="logTo"></label>
      <label>Show<select id="logType"><option value="issued">Items issued</option><option value="received">Stock received</option><option value="all">Everything</option></select></label>
    </div>
    <div class="toolbar">
      <div class="stats grow" id="logStats" style="margin:0"></div>
      <button class="btn ghost" id="dlLog">Download this list</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Issued to / from</th><th>Purpose</th><th>Recorded by</th><th><span style="position:absolute;left:-9999px">Actions</span></th></tr></thead>
        <tbody id="logBody"><tr><td colspan="7" class="loading">Loading log…</td></tr></tbody>
      </table>
    </div>
  </section>

  <!-- SUPPLIERS -->
  <section id="view-suppliers" role="tabpanel" hidden>
    <div class="toolbar">
      <div class="grow"><input type="search" id="supSearch" placeholder="Search suppliers, contacts or what they supply" aria-label="Search suppliers"></div>
      <button class="btn ghost" id="dlSup">Download suppliers</button>
      <button class="btn tape" id="addSupBtn">+ Add supplier</button>
    </div>
    <div id="supGrid" class="grid"></div>
  </section>
</div>

<!-- Item dialog -->
<dialog id="itemDlg" aria-labelledby="itemDlgTitle">
  <form id="itemForm" novalidate>
    <div class="dhead"><h2 id="itemDlgTitle">Add item</h2></div>
    <div class="dbody">
      <label class="full">Item name<input type="text" name="name" required maxlength="120" autocomplete="off"></label>
      <label>Category<input type="text" name="category" list="catList" maxlength="60" placeholder="e.g. Cleaning" autocomplete="off"></label>
      <label>Storage location<input type="text" name="location" maxlength="60" placeholder="e.g. Cupboard B, shelf 2" autocomplete="off"></label>
      <label>Quantity in stock<input type="number" name="quantity" min="0" step="1" inputmode="numeric" required></label>
      <label>Unit<input type="text" name="unit" maxlength="30" placeholder="e.g. boxes, packs, each" list="unitList" autocomplete="off"></label>
      <label>Flag as low at or below<input type="number" name="minLevel" min="0" step="1" inputmode="numeric"><span class="hint">Flagged for reordering at this number.</span></label>
      <label>Supplier<select name="supplierId" id="itemSupplier"></select><span class="hint">Add suppliers in the Suppliers tab.</span></label>
      <div class="full">
        <div style="font-weight:700;font-size:.93rem;margin-bottom:6px">Photo</div>
        <div class="photopick">
          <div class="prev" id="photoPrev">No photo</div>
          <div class="btns">
            <label class="btn ghost small" style="flex-direction:row;font-weight:700">Choose or take photo<input type="file" id="photoInput" accept="image/*" hidden></label>
            <button type="button" class="btn ghost small" id="photoRemove" hidden>Remove photo</button>
          </div>
        </div>
      </div>
      <label class="full">Notes<textarea name="notes" maxlength="600" placeholder="Size, colour, anything useful"></textarea></label>
      <p class="err" id="itemErr"></p>
    </div>
    <div class="dfoot">
      <button type="button" class="btn danger small left" id="deleteItemBtn" hidden>Delete item</button>
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn" id="saveItemBtn">Save item</button>
    </div>
  </form>
</dialog>

<!-- Issue / receive dialog -->
<dialog id="moveDlg" aria-labelledby="moveTitle">
  <form id="moveForm" novalidate>
    <div class="dhead"><h2 id="moveTitle">Issue item</h2><p id="moveSub"></p></div>
    <div class="dbody">
      <label>Quantity<input type="number" name="qty" min="1" step="1" inputmode="numeric" required></label>
      <label>Date<input type="date" name="date" required></label>
      <label class="full"><span id="personText">Issued to</span><input type="text" name="person" maxlength="100" list="personList" autocomplete="off"><span class="hint" id="personHint"></span></label>
      <label class="full" id="purposeLabel">What it's for<input type="text" name="purpose" maxlength="160" list="purposeList" autocomplete="off" placeholder="e.g. Summer Programme art session"></label>
      <label class="full">Recorded by<input type="text" name="by" maxlength="80" autocomplete="off" placeholder="Your name"></label>
      <label class="full">Notes<textarea name="notes" maxlength="400"></textarea></label>
      <p class="err" id="moveErr"></p>
    </div>
    <div class="dfoot">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn" id="moveSave">Record issue</button>
    </div>
  </form>
</dialog>

<!-- Supplier dialog -->
<dialog id="supDlg" aria-labelledby="supTitle">
  <form id="supForm" novalidate>
    <div class="dhead"><h2 id="supTitle">Add supplier</h2></div>
    <div class="dbody">
      <label class="full">Supplier name<input type="text" name="name" maxlength="120" required autocomplete="off"></label>
      <label>Contact person<input type="text" name="contact" maxlength="100" autocomplete="off"></label>
      <label>Our account number<input type="text" name="accountRef" maxlength="60" autocomplete="off"><span class="hint">Customer or account reference with this supplier</span></label>
      <label>Phone<input type="tel" name="phone" maxlength="40" autocomplete="off"></label>
      <label>Other phone<input type="tel" name="phone2" maxlength="40" autocomplete="off"></label>
      <label>Email<input type="email" name="email" maxlength="120" autocomplete="off"></label>
      <label>Website<input type="text" name="website" maxlength="200" autocomplete="off" placeholder="e.g. www.example.gi"></label>
      <label class="full">Address<textarea name="address" maxlength="300"></textarea></label>
      <label class="full">What they supply<input type="text" name="supplies" maxlength="300" autocomplete="off" placeholder="e.g. Cleaning products, paper towels"></label>
      <label class="full">Notes<textarea name="notes" maxlength="800" placeholder="Opening hours, delivery days, minimum order…"></textarea></label>
      <p class="err" id="supErr"></p>
    </div>
    <div class="dfoot">
      <button type="button" class="btn danger small left" id="deleteSupBtn" hidden>Delete supplier</button>
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn" id="saveSupBtn">Save supplier</button>
    </div>
  </form>
</dialog>

<!-- Confirm -->
<dialog id="confirmDlg" aria-labelledby="confirmTitle">
  <form id="confirmForm">
    <div class="dhead"><h2 id="confirmTitle">Are you sure?</h2><p id="confirmText"></p></div>
    <div class="dbody"><label class="full checkline" id="confirmCheckWrap" hidden><input type="checkbox" id="confirmCheck"><span id="confirmCheckText"></span></label></div>
    <div class="dfoot">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn danger" id="confirmOk">Delete</button>
    </div>
  </form>
</dialog>

<dialog id="lightbox" class="lightbox" aria-label="Item photo">
  <img id="lightImg" alt="">
  <div class="cap"><strong id="lightCap"></strong><button class="btn ghost small" data-close>Close</button></div>
</dialog>

<datalist id="catList"></datalist>
<datalist id="unitList"><option>each</option><option>boxes</option><option>packs</option><option>bottles</option><option>rolls</option><option>pairs</option></datalist>
<datalist id="personList"></datalist>
<datalist id="purposeList"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
  const int = v => { const n=parseInt(v,10); return Number.isFinite(n)?n:NaN; };
  const store = { get(k){ try{return localStorage.getItem(k);}catch{return null;} }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch{} } };
  const PHOTO_SVG = '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>';

  let token = store.get("stores.token");
  let S = { version:0, items:[], moves:[], suppliers:[] };
  let loaded = false, statusFilter="all", currentTab="stock";
  let editingId=null, pendingPhoto=null, removePhoto=false, moveCtx=null, editingSup=null;
  let pollTimer=null, busy=0;

  const photoUrl = id => `/api/photos/${encodeURIComponent(id)}?t=${encodeURIComponent(token)}`;
  const itemById = id => S.items.find(i=>i.id===id);
  const supById = id => (S.suppliers||[]).find(s=>s.id===id);
  function status(it){ const q=it.quantity||0, m=it.minLevel||0; return q<=0?"out":q<=m?"low":"ok"; }
  const statusText = {ok:"In stock", low:"Running low", out:"Out of stock"};
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2800); }

  // ---------- API ----------
  async function api(method, path, body, rawType){
    const headers = {};
    if(token) headers.authorization = "Bearer "+token;
    if(rawType) headers["content-type"]=rawType; else if(body) headers["content-type"]="application/json";
    let res;
    try{ res = await fetch("/api/"+path, {method, headers, body: rawType?body:(body?JSON.stringify(body):undefined), cache:"no-store"}); }
    catch{ throw new Error("Can't reach the server. Check your internet connection."); }
    const data = await res.json().catch(()=>({}));
    if(res.status===401 && path!=="login"){ logout("Your login has expired. Please log in again."); throw new Error("Please log in again."); }
    if(!res.ok) throw new Error(data.error || "Something went wrong. Try again.");
    return data;
  }
  function apply(data){
    if(!data || data.unchanged || !Array.isArray(data.items)) return;
    S = { version:data.version||0, items:data.items||[], moves:data.moves||[], suppliers:data.suppliers||[] };
    loaded = true; renderAll();
  }
  async function refresh(){
    if(!token) return;
    try{ apply(await api("GET", "state?v="+(loaded?S.version:0))); setLive(true); }
    catch(e){ if(token) setLive(false); }
  }
  function setLive(ok){ $("#live").classList.toggle("off",!ok); $("#liveText").textContent = ok?"Live":"Reconnecting…"; }
  function startPolling(){
    stopPolling();
    const tick = async ()=>{ if(document.visibilityState==="visible" && !busy) await refresh(); pollTimer=setTimeout(tick, 4000); };
    pollTimer=setTimeout(tick,4000);
  }
  function stopPolling(){ clearTimeout(pollTimer); pollTimer=null; }
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && token) refresh(); });
  window.addEventListener("online", ()=>{ if(token) refresh(); });
  async function write(fn){ busy++; try{ const d=await fn(); apply(d); return d; } finally{ busy--; } }

  // ---------- Login ----------
  function showLogin(msg){ $("#app").hidden=true; $("#loginScreen").hidden=false; $("#loginErr").textContent=msg||""; setTimeout(()=>$("#loginForm").username.focus(),30); }
  function showApp(){ $("#loginScreen").hidden=true; $("#app").hidden=false; refresh(); startPolling(); }
  function logout(msg){ token=null; store.set("stores.token",null); stopPolling(); S={version:0,items:[],moves:[],suppliers:[]}; loaded=false; $$("dialog").forEach(d=>d.open&&d.close()); showLogin(msg); }
  $("#pwToggle").onclick=()=>{ const p=$("#pw"), show=p.type==="password"; p.type=show?"text":"password"; $("#pwToggle").textContent=show?"Hide":"Show"; $("#pwToggle").setAttribute("aria-label", show?"Hide password":"Show password"); };
  $("#loginForm").addEventListener("submit", async e=>{
    e.preventDefault(); const f=e.target, err=$("#loginErr"), b=$("#loginBtn");
    if(!f.username.value.trim()||!f.password.value){ err.textContent="Enter the username and password."; return; }
    b.disabled=true; b.textContent="Logging in…"; err.textContent="";
    try{ const d=await api("POST","login",{username:f.username.value.trim(), password:f.password.value}); token=d.token; store.set("stores.token",token); f.password.value=""; showApp(); }
    catch(x){ err.textContent=x.message; }
    finally{ b.disabled=false; b.textContent="Log in"; }
  });
  $("#logoutBtn").onclick=()=>logout();

  // ---------- Tabs & dialogs ----------
  function showTab(t){ currentTab=t; $$("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t)); ["stock","log","suppliers"].forEach(v=>$("#view-"+v).hidden = v!==t); }
  $$("nav.tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  $$("dialog [data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
  $$("dialog").forEach(d=>d.addEventListener("click",e=>{ if(e.target===d) d.close(); }));

  function renderAll(){ renderStock(); renderLog(); renderSuppliers(); }

  // ---------- Stock ----------
  function filteredItems(){
    const q=$("#search").value.trim().toLowerCase(), cat=$("#catFilter").value;
    const rank={out:0,low:1,ok:2};
    return S.items.slice().sort((a,b)=> rank[status(a)]-rank[status(b)] || (a.name||"").localeCompare(b.name||""))
      .filter(it=>{
        if(cat && (it.category||"")!==cat) return false;
        if(statusFilter==="low" && status(it)==="ok") return false;
        if(statusFilter==="out" && status(it)!=="out") return false;
        const sup=supById(it.supplierId);
        if(q && !`${it.name} ${it.category} ${it.location} ${it.notes} ${sup?sup.name:""}`.toLowerCase().includes(q)) return false;
        return true;
      });
  }
  function renderStock(){
    const lowItems=S.items.filter(it=>status(it)!=="ok").sort((a,b)=>(a.name||"").localeCompare(b.name||""));
    const outN=lowItems.filter(it=>status(it)==="out").length;
    const lc=$("#lowCount"); lc.hidden=!lowItems.length; lc.textContent=lowItems.length;
    const al=$("#lowAlert");
    if(lowItems.length){
      al.classList.remove("hidden");
      $("#lowAlertTitle").textContent = lowItems.length===1?"1 item needs reordering":`${lowItems.length} items need reordering`;
      const names=lowItems.slice(0,6).map(it=>`${it.name} (${it.quantity||0})`).join(", ");
      const supNames=[...new Set(lowItems.map(it=>supById(it.supplierId)?.name).filter(Boolean))];
      $("#lowAlertNames").innerHTML = esc(names + (lowItems.length>6?` and ${lowItems.length-6} more`:"")) + (supNames.length?`<span class="sups">Order from: ${esc(supNames.join(", "))}</span>`:"");
    } else al.classList.add("hidden");

    const monthStart=today().slice(0,8)+"01";
    const issuedMonth=S.moves.filter(m=>m.type==="issued"&&(m.date||"")>=monthStart).length;
    $("#stats").innerHTML=`<span><b>${S.items.length}</b>items</span><span><b>${lowItems.length-outN}</b>running low</span><span><b>${outN}</b>out of stock</span><span><b>${issuedMonth}</b>issues this month</span>`;

    const cats=[...new Set(S.items.map(i=>i.category).filter(Boolean))].sort();
    const cf=$("#catFilter"), cur=cf.value;
    cf.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
    $("#catList").innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join("");

    const grid=$("#grid");
    if(!loaded){ grid.innerHTML='<div class="loading" style="grid-column:1/-1">Loading stores…</div>'; return; }
    if(!S.items.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>No items yet</h2><p>Add your first item to start tracking stock.</p><button class="btn tape" data-add>+ Add item</button></div>`; return; }
    const shown=filteredItems();
    if(!shown.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>Nothing matches</h2><p>Try a different search or clear the filters.</p></div>`; return; }
    grid.innerHTML=shown.map(it=>{
      const s=status(it), qty=it.quantity||0, min=it.minLevel||0;
      const scale=Math.max(min*3,qty,1), pct=Math.min(100,qty/scale*100), markPct=Math.min(100,min/scale*100);
      const sup=supById(it.supplierId);
      const photo = it.photo
        ? `<button class="photo" data-view="${esc(it.id)}" aria-label="View photo of ${esc(it.name)}"><img src="${esc(photoUrl(it.photo))}" alt="" loading="lazy" onerror="this.parentNode.classList.add('none');this.remove()"></button>`
        : `<div class="photo none">${PHOTO_SVG}</div>`;
      return `<article class="card">${photo}
        <div class="label">
          <div class="row1"><div><h3>${esc(it.name)}</h3><div class="meta">${esc([it.category,it.location].filter(Boolean).join(" • "))}</div></div><span class="badge ${s}">${statusText[s]}</span></div>
          <div class="qty">${qty}<small>${esc(it.unit||"")}</small></div>
          ${min>0?`<div class="meter ${s}" aria-hidden="true"><div class="fill" style="width:${pct}%"></div><div class="mark" style="left:${markPct}%"></div></div>
          <div class="meterlabel"><span>Flag at ${min}</span>${s==="ok"?`<span>${qty-min} above</span>`:""}</div>`:`<div class="meterlabel"><span>No low-stock level set</span></div>`}
          ${sup?`<div class="supline">Supplier: <a href="#" data-sup="${esc(sup.id)}">${esc(sup.name)}</a>${sup.phone&&s!=="ok"?` • <a href="tel:${esc(sup.phone.replace(/[^\d+]/g,""))}">${esc(sup.phone)}</a>`:""}</div>`:""}
          <div class="actions">
            <button class="btn small" data-issue="${esc(it.id)}" ${qty<=0?"disabled":""}>Issue</button>
            <button class="btn small ghost" data-receive="${esc(it.id)}">Add stock</button>
            <button class="btn small ghost" data-edit="${esc(it.id)}">Edit</button>
          </div>
        </div></article>`;
    }).join("");
  }
  $("#grid").addEventListener("click", e=>{
    const a=e.target.closest("[data-sup]"); if(a){ e.preventDefault(); showTab("suppliers"); $("#supSearch").value=supById(a.dataset.sup)?.name||""; renderSuppliers(); return; }
    const t=e.target.closest("button"); if(!t) return;
    if(t.hasAttribute("data-add")) openItem(null);
    else if(t.dataset.issue) openMove(itemById(t.dataset.issue),"issued");
    else if(t.dataset.receive) openMove(itemById(t.dataset.receive),"received");
    else if(t.dataset.edit) openItem(itemById(t.dataset.edit));
    else if(t.dataset.view){ const it=itemById(t.dataset.view); if(it?.photo){ $("#lightImg").src=photoUrl(it.photo); $("#lightImg").alt="Photo of "+it.name; $("#lightCap").textContent=it.name; $("#lightbox").showModal(); } }
  });
  $("#search").addEventListener("input",renderStock);
  $("#catFilter").addEventListener("change",renderStock);
  $$(".chip").forEach(c=>c.onclick=()=>{ statusFilter=c.dataset.status; $$(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c)); renderStock(); });
  $("#showLowBtn").onclick=()=>$$(".chip").find(c=>c.dataset.status==="low").click();
  $("#addItemBtn").onclick=()=>openItem(null);

  // ---------- Item dialog ----------
  function setPrev(src){ $("#photoPrev").innerHTML = src?`<img src="${esc(src)}" alt="">`:"No photo"; $("#photoRemove").hidden=!src; }
  function supplierOptions(sel){ return '<option value="">None</option>'+(S.suppliers||[]).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${esc(s.id)}" ${s.id===sel?"selected":""}>${esc(s.name)}</option>`).join(""); }
  function openItem(it){
    editingId=it?it.id:null; pendingPhoto=null; removePhoto=false;
    const f=$("#itemForm"); f.reset(); $("#itemErr").textContent="";
    $("#itemDlgTitle").textContent=it?"Edit item":"Add item"; $("#deleteItemBtn").hidden=!it;
    f.name.value=it?.name||""; f.category.value=it?.category||""; f.location.value=it?.location||"";
    f.quantity.value=it?(it.quantity||0):""; f.unit.value=it?.unit||""; f.minLevel.value=it?(it.minLevel||0):""; f.notes.value=it?.notes||"";
    $("#itemSupplier").innerHTML=supplierOptions(it?.supplierId||"");
    setPrev(it?.photo?photoUrl(it.photo):null);
    $("#itemDlg").showModal(); f.name.focus();
  }
  $("#photoInput").addEventListener("change", async e=>{
    const file=e.target.files[0]; e.target.value=""; if(!file) return;
    try{ pendingPhoto=await shrink(file); removePhoto=false; setPrev(URL.createObjectURL(pendingPhoto)); }
    catch{ $("#itemErr").textContent="That file couldn't be read as an image. Try a JPG or PNG."; }
  });
  $("#photoRemove").onclick=()=>{ pendingPhoto=null; removePhoto=true; setPrev(null); };
  function shrink(file){
    return new Promise((res,rej)=>{
      const img=new Image(), url=URL.createObjectURL(file);
      img.onload=()=>{ const r=Math.min(1,1000/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.82); };
      img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("decode")); };
      img.src=url;
    });
  }
  $("#itemForm").addEventListener("submit", async e=>{
    e.preventDefault(); const f=e.target, err=$("#itemErr");
    const name=f.name.value.trim(), qty=int(f.quantity.value), min=f.minLevel.value===""?0:int(f.minLevel.value);
    if(!name){ err.textContent="Give the item a name."; f.name.focus(); return; }
    if(!(qty>=0)){ err.textContent="Enter the quantity in stock (0 or more)."; f.quantity.focus(); return; }
    if(!(min>=0)){ err.textContent="The low-stock level must be 0 or more."; f.minLevel.focus(); return; }
    const btn=$("#saveItemBtn"); btn.disabled=true; btn.textContent="Saving…";
    try{
      const existing=editingId?itemById(editingId):null;
      let photo=existing?.photo||null;
      if(pendingPhoto){ const up=await api("POST","photos",pendingPhoto,"image/jpeg"); photo=up.id; }
      else if(removePhoto) photo=null;
      await write(()=>api("POST","items",{ id:existing?.id, name, quantity:qty, minLevel:min, category:f.category.value, location:f.location.value, unit:f.unit.value, notes:f.notes.value, supplierId:f.supplierId.value, photo }));
      $("#itemDlg").close(); toast(existing?"Item saved":"Item added");
    }catch(x){ err.textContent=x.message; }
    finally{ btn.disabled=false; btn.textContent="Save item"; }
  });
  $("#deleteItemBtn").onclick=()=>{
    const it=itemById(editingId); if(!it) return;
    confirmBox({ title:`Delete ${it.name}?`, text:"The item is removed from stock. Its past entries stay in the issue log.", ok:"Delete item",
      run: async()=>{ await write(()=>api("DELETE","items/"+encodeURIComponent(it.id))); $("#itemDlg").close(); toast("Item deleted"); } });
  };

  // ---------- Issue / receive ----------
  function openMove(it,type){
    if(!it) return; moveCtx={id:it.id,type};
    const f=$("#moveForm"); f.reset(); $("#moveErr").textContent="";
    const issue=type==="issued";
    $("#moveTitle").textContent=issue?`Issue ${it.name}`:`Add stock: ${it.name}`;
    $("#moveSub").textContent=`${it.quantity||0} ${it.unit||""} in stock now`;
    $("#personText").textContent=issue?"Issued to":"Received from";
    $("#personHint").textContent=issue?"Person, team or programme receiving the items":"Supplier or donor (optional)";
    $("#purposeLabel").hidden=!issue;
    $("#moveSave").textContent=issue?"Record issue":"Add to stock";
    f.date.value=today(); f.by.value=store.get("stores.by")||"";
    if(!issue){ const sup=supById(it.supplierId); if(sup) f.person.value=sup.name; }
    const people=issue ? [...new Set(S.moves.filter(m=>m.type==="issued").map(m=>m.person).filter(Boolean))]
                       : [...new Set([...(S.suppliers||[]).map(s=>s.name), ...S.moves.filter(m=>m.type==="received").map(m=>m.person).filter(Boolean)])];
    $("#personList").innerHTML=people.slice(0,100).map(p=>`<option value="${esc(p)}">`).join("");
    $("#purposeList").innerHTML=[...new Set(S.moves.map(m=>m.purpose).filter(Boolean))].slice(0,100).map(p=>`<option value="${esc(p)}">`).join("");
    $("#moveDlg").showModal(); f.qty.focus();
  }
  $("#moveForm").addEventListener("submit", async e=>{
    e.preventDefault(); if(!moveCtx) return;
    const f=e.target, err=$("#moveErr"), issue=moveCtx.type==="issued", it=itemById(moveCtx.id);
    if(!it){ err.textContent="That item no longer exists."; return; }
    const qty=int(f.qty.value), have=it.quantity||0;
    if(!(qty>=1)){ err.textContent="Enter a quantity of at least 1."; f.qty.focus(); return; }
    if(issue && qty>have){ err.textContent=`Only ${have} in stock. Issue ${have} or fewer.`; f.qty.focus(); return; }
    if(issue && !f.person.value.trim()){ err.textContent="Say who the items were issued to."; f.person.focus(); return; }
    if(!f.date.value){ err.textContent="Pick a date."; return; }
    const btn=$("#moveSave"); btn.disabled=true;
    try{
      store.set("stores.by", f.by.value.trim());
      const d=await write(()=>api("POST","moves",{ type:moveCtx.type, itemId:it.id, qty, person:f.person.value, purpose:f.purpose.value, by:f.by.value, date:f.date.value, notes:f.notes.value }));
      $("#moveDlg").close();
      const s=d.result?.status;
      toast(issue ? (s==="ok"?`Issued ${qty} ${it.name}`:`Issued. ${it.name} is now ${s==="out"?"out of stock":"running low"}`) : `Added ${qty} to ${it.name}`);
    }catch(x){ err.textContent=x.message; }
    finally{ btn.disabled=false; }
  });

  // ---------- Log ----------
  function filteredMoves(){
    const q=$("#logSearch").value.trim().toLowerCase(), from=$("#logFrom").value, to=$("#logTo").value, type=$("#logType").value;
    return S.moves.filter(m=>{
      if(type!=="all" && m.type!==type) return false;
      if(from && (m.date||"")<from) return false;
      if(to && (m.date||"")>to) return false;
      if(q && !`${m.itemName} ${m.person} ${m.purpose} ${m.by} ${m.notes}`.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
  }
  function renderLog(){
    const body=$("#logBody");
    if(!loaded){ body.innerHTML='<tr><td colspan="7" class="loading">Loading log…</td></tr>'; return; }
    const list=filteredMoves(), issued=list.filter(m=>m.type==="issued");
    const total=issued.reduce((s,m)=>s+(m.qty||0),0), people=new Set(issued.map(m=>m.person)).size;
    $("#logStats").innerHTML=`<span><b>${list.length}</b>${list.length===1?"entry":"entries"}</span>`+(issued.length?`<span><b>${total}</b>items issued</span><span><b>${people}</b>${people===1?"recipient":"recipients"}</span>`:"");
    if(!S.moves.length){ body.innerHTML=`<tr><td colspan="7"><div class="empty" style="border:0"><h2>Nothing issued yet</h2><p>Use the Issue button on any item in Stock and it will be recorded here.</p></div></td></tr>`; return; }
    if(!list.length){ body.innerHTML=`<tr><td colspan="7"><div class="empty" style="border:0"><h2>No entries match</h2><p>Widen the dates or clear the search.</p></div></td></tr>`; return; }
    body.innerHTML=list.map(m=>{
      const issue=m.type==="issued", it=itemById(m.itemId);
      return `<tr>
        <td style="white-space:nowrap">${fmtDate(m.date)}</td>
        <td><div class="itemcell">${it?.photo?`<img class="thumb" src="${esc(photoUrl(it.photo))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:`<span class="thumb"></span>`}<div>${esc(m.itemName)}${m.notes?`<div class="subtle">${esc(m.notes)}</div>`:""}</div></div></td>
        <td class="num ${issue?"outq":"in"}">${issue?"−":"+"}${m.qty} <span class="subtle" style="font-weight:400">${esc(m.unit||"")}</span></td>
        <td>${esc(m.person)||'<span class="subtle">—</span>'}${issue?"":'<div class="subtle">Stock received</div>'}</td>
        <td>${esc(m.purpose)||'<span class="subtle">—</span>'}</td>
        <td>${esc(m.by)||'<span class="subtle">—</span>'}</td>
        <td><button class="btn ghost small" data-delmove="${esc(m.id)}">Delete</button></td>
      </tr>`;
    }).join("");
  }
  ["#logSearch","#logFrom","#logTo","#logType"].forEach(s=>$(s).addEventListener("input",renderLog));
  $("#logBody").addEventListener("click", e=>{
    const b=e.target.closest("[data-delmove]"); if(!b) return;
    const m=S.moves.find(x=>x.id===b.dataset.delmove); if(!m) return;
    const issue=m.type==="issued", it=itemById(m.itemId);
    confirmBox({ title:"Delete this entry?", text:`${issue?"Issue of":"Delivery of"} ${m.qty} ${m.itemName} on ${fmtDate(m.date)}.`,
      check: it?(issue?`Put ${m.qty} back into stock`:`Take ${m.qty} back out of stock`):null, ok:"Delete entry",
      run: async checked=>{ await write(()=>api("DELETE",`moves/${encodeURIComponent(m.id)}${checked?"?restock=1":""}`)); toast("Entry deleted"); } });
  });

  // ---------- Suppliers ----------
  function renderSuppliers(){
    const grid=$("#supGrid");
    if(!loaded){ grid.innerHTML='<div class="loading" style="grid-column:1/-1">Loading suppliers…</div>'; return; }
    const sups=(S.suppliers||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
    if(!sups.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>No suppliers yet</h2><p>Add a supplier to keep their contact details in one place and link them to items.</p><button class="btn tape" data-addsup>+ Add supplier</button></div>`; return; }
    const q=$("#supSearch").value.trim().toLowerCase();
    const shown=sups.filter(s=>!q || `${s.name} ${s.contact} ${s.supplies} ${s.email} ${s.phone} ${s.notes}`.toLowerCase().includes(q));
    if(!shown.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><h2>No suppliers match</h2><p>Try a different search.</p></div>`; return; }
    const tel=p=>esc(String(p).replace(/[^\d+]/g,""));
    const web=w=>{ const u=/^https?:\/\//i.test(w)?w:"https://"+w; return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(w.replace(/^https?:\/\//i,""))}</a>`; };
    grid.innerHTML=shown.map(s=>{
      const linked=S.items.filter(i=>i.supplierId===s.id), low=linked.filter(i=>status(i)!=="ok");
      const rows=[
        s.contact&&["Contact",esc(s.contact)],
        s.phone&&["Phone",`<a href="tel:${tel(s.phone)}">${esc(s.phone)}</a>`],
        s.phone2&&["Other",`<a href="tel:${tel(s.phone2)}">${esc(s.phone2)}</a>`],
        s.email&&["Email",`<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`],
        s.website&&["Web",web(s.website)],
        s.address&&["Address",esc(s.address).replace(/\n/g,"<br>")],
        s.accountRef&&["Account",esc(s.accountRef)],
      ].filter(Boolean);
      return `<article class="sup"><div class="label">
        <div class="row1"><div><h3>${esc(s.name)}</h3>${s.supplies?`<div class="meta">${esc(s.supplies)}</div>`:""}</div></div>
        ${rows.length?`<dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`:""}
        ${s.notes?`<div class="subtle">${esc(s.notes)}</div>`:""}
        ${low.length?`<div class="reorder"><strong>To reorder:</strong> ${esc(low.map(i=>`${i.name} (${i.quantity||0})`).join(", "))}</div>`:""}
        <div class="supline">${linked.length?`${linked.length} linked ${linked.length===1?"item":"items"}`:"No items linked yet"}</div>
        <div class="actions"><button class="btn small ghost" data-editsup="${esc(s.id)}">Edit</button></div>
      </div></article>`;
    }).join("");
  }
  $("#supSearch").addEventListener("input",renderSuppliers);
  $("#addSupBtn").onclick=()=>openSup(null);
  $("#supGrid").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; if(b.hasAttribute("data-addsup")) openSup(null); else if(b.dataset.editsup) openSup(supById(b.dataset.editsup)); });
  const SUP_FIELDS=["name","contact","accountRef","phone","phone2","email","website","address","supplies","notes"];
  function openSup(s){
    editingSup=s?s.id:null; const f=$("#supForm"); f.reset(); $("#supErr").textContent="";
    $("#supTitle").textContent=s?"Edit supplier":"Add supplier"; $("#deleteSupBtn").hidden=!s;
    SUP_FIELDS.forEach(k=>f[k].value=s?.[k]||"");
    $("#supDlg").showModal(); f.name.focus();
  }
  $("#supForm").addEventListener("submit", async e=>{
    e.preventDefault(); const f=e.target, err=$("#supErr");
    if(!f.name.value.trim()){ err.textContent="Give the supplier a name."; f.name.focus(); return; }
    if(f.email.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())){ err.textContent="That email address doesn't look right."; f.email.focus(); return; }
    const body={id:editingSup||undefined}; SUP_FIELDS.forEach(k=>body[k]=f[k].value);
    const btn=$("#saveSupBtn"); btn.disabled=true;
    try{ await write(()=>api("POST","suppliers",body)); $("#supDlg").close(); toast(editingSup?"Supplier saved":"Supplier added"); }
    catch(x){ err.textContent=x.message; }
    finally{ btn.disabled=false; }
  });
  $("#deleteSupBtn").onclick=()=>{
    const s=supById(editingSup); if(!s) return;
    const n=S.items.filter(i=>i.supplierId===s.id).length;
    confirmBox({ title:`Delete ${s.name}?`, text: n?`${n} ${n===1?"item is":"items are"} linked to this supplier. They'll stay in stock with no supplier.`:"Their contact details will be removed.", ok:"Delete supplier",
      run: async()=>{ await write(()=>api("DELETE","suppliers/"+encodeURIComponent(s.id))); $("#supDlg").close(); toast("Supplier deleted"); } });
  };

  // ---------- Downloads ----------
  function downloadCsv(name, rows){
    const cell=v=>{ const s=String(v??""); return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
    const blob=new Blob(["\uFEFF"+rows.map(r=>r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }
  $("#dlStock").onclick=()=>{
    const list=filteredItems(); if(!list.length){ toast("No items to download"); return; }
    const label={all:"stock",low:"reorder",out:"out-of-stock"}[statusFilter];
    downloadCsv(`${label}-list-${today()}.csv`, [["Item","Category","Location","Quantity","Unit","Low-stock level","Status","Supplier","Supplier phone","Notes"]]
      .concat(list.map(it=>{ const s=supById(it.supplierId); return [it.name,it.category,it.location,it.quantity||0,it.unit,it.minLevel||0,statusText[status(it)],s?.name,s?.phone,it.notes]; })));
    toast(statusFilter==="all"?"Stock list downloaded":"Filtered list downloaded");
  };
  $("#dlLog").onclick=()=>{
    const list=filteredMoves(); if(!list.length){ toast("Nothing to download with these filters"); return; }
    downloadCsv(`issue-log-${today()}.csv`, [["Date","Type","Item","Quantity","Unit","Issued to / received from","Purpose","Recorded by","Notes"]]
      .concat(list.map(m=>[fmtDate(m.date),m.type==="issued"?"Issued":"Received",m.itemName,m.qty,m.unit,m.person,m.purpose,m.by,m.notes])));
    toast("Log downloaded");
  };
  $("#dlSup").onclick=()=>{
    const list=(S.suppliers||[]).slice().sort((a,b)=>a.name.localeCompare(b.name)); if(!list.length){ toast("No suppliers to download"); return; }
    downloadCsv(`suppliers-${today()}.csv`, [["Supplier","Contact","Phone","Other phone","Email","Website","Address","Account number","Supplies","Notes"]]
      .concat(list.map(s=>[s.name,s.contact,s.phone,s.phone2,s.email,s.website,s.address,s.accountRef,s.supplies,s.notes])));
    toast("Suppliers downloaded");
  };

  // ---------- Confirm ----------
  let confirmRun=null;
  function confirmBox({title,text,ok,run,check}){
    $("#confirmTitle").textContent=title; $("#confirmText").textContent=text; $("#confirmOk").textContent=ok||"Delete";
    $("#confirmCheckWrap").hidden=!check; $("#confirmCheck").checked=!!check; $("#confirmCheckText").textContent=check||"";
    confirmRun=run; $("#confirmDlg").showModal();
  }
  $("#confirmForm").addEventListener("submit", async e=>{
    e.preventDefault(); const b=$("#confirmOk"); b.disabled=true;
    try{ await confirmRun($("#confirmCheck").checked); $("#confirmDlg").close(); }
    catch(x){ toast(x.message); }
    finally{ b.disabled=false; }
  });

  // ---------- Boot ----------
  if(token) showApp(); else showLogin();
})();
</script>
</body>
</html>
